syntax = "proto3";

package customer;

service CustomerService {
  rpc GetCustomers(GetCustomersRequest) returns (CustomerListResponse);
  rpc GetCustomer(GetCustomerRequest) returns (CustomerResponse);
  rpc CustomerExists(CustomerExistsRequest) returns (CustomerExistsResponse);
  rpc IsCustomerActive(IsCustomerActiveRequest) returns (CustomerActiveResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc CreateCustomer(SaveCustomerRequest) returns (CustomerResponse);
  rpc UpdateCustomer(SaveCustomerRequest) returns (CustomerResponse);
  rpc DeleteCustomer(GetCustomerRequest) returns (CustomerResponse);
  rpc ReactivateCustomer(GetCustomerRequest) returns (CustomerResponse);
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  bool valido = 1;
  string rol = 2;
  int64 cliente_id = 3;  // 0 si es ADMIN
  string nombre = 4;
}

// Se usa para crear y modificar
message SaveCustomerRequest {
  int64 id = 1;                 // solo al modificar
  string documento = 2;
  string nombre = 3;
  string apellido = 4;
  string email = 5;
  string telefono = 6;
  string fecha_nacimiento = 7;  // formato YYYY-MM-DD
  string password = 8;          // solo al crear
  string rol = 9;               // solo al crear
}

message GetCustomersRequest {}

message GetCustomerRequest {
  int64 id = 1;
}

message CustomerExistsRequest {
  int64 id = 1;
}

message IsCustomerActiveRequest {
  int64 id = 1;
}

message CustomerListResponse {
  repeated Customer customers = 1;
}

message CustomerResponse {
  Customer customer = 1;
}

message CustomerExistsResponse {
  bool exists = 1;
}

message CustomerActiveResponse {
  bool active = 1;
}

message Customer {
  int64 id = 1;
  string nombre = 2;
  string apellido = 3;
  string email = 4;
  string documento = 5;
  string telefono = 6;
  bool activo = 7;
  string fecha_nacimiento = 8;
}