syntax = "proto3";

package vehicle;

service VehicleService {
  rpc GetVehicles (GetVehiclesRequest)
      returns (VehicleListResponse);

  rpc GetVehicle (GetVehicleRequest)
      returns (VehicleResponse);

  rpc GetAvailableVehicles (AvailabilityRequest)
      returns (VehicleListResponse);

  rpc UpdateVehicleStatus (UpdateVehicleStatusRequest)
      returns (VehicleResponse);

  rpc CreateVehicle(CreateVehicleRequest)
      returns (VehicleResponse);
      
  rpc UpdateVehicle(UpdateVehicleRequest)
      returns (VehicleResponse);
}

message GetVehiclesRequest {}

message GetVehicleRequest {
  int64 id = 1;
}

message VehicleResponse {
  Vehicle vehicle = 1;
}

message VehicleListResponse {
  repeated Vehicle vehicles = 1;
}

message AvailabilityRequest {
  string fecha_inicio  = 1;
  string fecha_fin = 2;
}

message UpdateVehicleStatusRequest {
  int64 id = 1;
  string estado = 2;
}

message Vehicle {
  int64 id = 1;
  string patente = 2;
  string marca = 3;
  string modelo = 4;
  string estado = 5;
  int32 anio = 6;
  string tipoVehiculo = 7;
  string color = 8;
  string precio_diario = 9;
  bool activo = 10;
}

message CreateVehicleRequest {
  string patente = 1;
  string marca = 2;
  string modelo = 3;
  string estado = 4;
}

message UpdateVehicleRequest {
  int64 id = 1;
  string marca = 2;
  string modelo = 3;
  string estado = 4;
}