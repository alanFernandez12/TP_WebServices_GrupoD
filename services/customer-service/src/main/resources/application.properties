spring.application.name=customer-service

# Puerto gRPC (el gateway lo espera en 9092)
spring.grpc.server.port=${CUSTOMER_GRPC_PORT:9092}

# Base compartida "rentar". La contraseña se pasa por variable de entorno, no se commitea.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rentar}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
